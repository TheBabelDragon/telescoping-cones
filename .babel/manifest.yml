babel: "0.1"
identity:
  name: telescoping-cones
  owner: TheBabelDragon
  repo: TheBabelDragon/telescoping-cones
  url: https://github.com/TheBabelDragon/telescoping-cones
  kind: geometric-operator
  version: "0.2.0"
purpose: >
  Geometry-first attention operator. Nested cones compress a sensory field
  into state. Geometry is independent of PyTorch / MetaField / Aurora /
  Canonsphere / optical-body backends.
status: experimental
entrypoints:
  - kind: pages
    path: pages/index.html
  - kind: module
    path: telescoping_cones
  - kind: module
    path: js/index.js
runtime:
  language: python
  requires:
    - python>=3.10
    - numpy
inputs:
  - name: observations
  - name: geometry
outputs:
  - name: cone-state-v0.1
  - name: collapsed-state
  - name: attention
capabilities:
  - cone-transform
  - geometric-attention
  - adaptive-radius
  - aurora-routing
  - cone-memory
  - stereograph
  - pages-instrument
operations:
  safe: [cone-transform, geometric-attention, adaptive-radius, aurora-routing, cone-memory, stereograph, pages-instrument]
  mutation: []
